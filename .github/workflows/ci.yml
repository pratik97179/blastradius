name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Build dashboard
        working-directory: web/dashboard
        run: |
          npm ci
          npm run build

      - name: Install package deps
        run: dart pub get

      - name: Install fixture deps
        run: |
          set -euo pipefail
          for dir in test/fixtures/*/; do
            if [ -f "${dir}pubspec.yaml" ]; then
              echo "dart pub get ${dir}"
              (cd "$dir" && dart pub get)
            fi
          done

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test
